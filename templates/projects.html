<!DOCTYPE html>
<html>

<head>
    <title>Project Library - DependIQ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="manifest" href="/images/site.webmanifest">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="/static/js/theme.js?v=2"></script>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        .projects-container {
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .projects-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .projects-header h1 {
            color: var(--color-primary);
            font-size: 2rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--color-primary);
            color: var(--color-surface);
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: var(--color-surface);
            color: var(--color-primary);
            border: 1px solid var(--color-border);
        }

        .btn-secondary:hover {
            background: var(--color-hover);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .project-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .project-card:hover {
            border-color: var(--color-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .project-card.selected {
            border: 2px solid var(--color-primary);
        }

        .project-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .project-icon {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-surface);
            font-size: 24px;
            margin-right: 12px;
        }

        .project-icon.github {
            background: var(--color-primary);
        }

        .project-info {
            flex: 1;
        }

        .project-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 4px;
        }

        .project-source {
            font-size: 0.75rem;
            color: var(--color-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .project-synopsis {
            color: var(--color-secondary);
            font-size: 0.875rem;
            margin-bottom: 12px;
            line-height: 1.5;
            max-height: 4.5em;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .project-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--color-secondary);
            font-size: 0.875rem;
        }

        .stat .material-icons {
            font-size: 16px;
        }

        .project-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--color-success);
        }

        .badge.warning {
            background: rgba(245, 158, 11, 0.1);
            color: var(--color-warning);
        }

        .badge.info {
            background: rgba(59, 130, 246, 0.1);
            color: var(--color-info);
        }

        /* Sidebar */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }

        .sidebar-overlay.active {
            display: block;
        }

        .project-sidebar {
            position: fixed;
            right: -500px;
            top: 0;
            bottom: 0;
            width: 500px;
            background: var(--color-surface);
            border-left: 1px solid var(--color-border);
            z-index: 1000;
            transition: right 0.3s ease;
            overflow-y: auto;
        }

        .project-sidebar.active {
            right: 0;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--color-surface);
            z-index: 10;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-primary);
        }

        .close-sidebar {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--color-secondary);
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-sidebar:hover {
            background: var(--color-hover);
        }

        .sidebar-content {
            padding: 24px;
        }

        .sidebar-section {
            margin-bottom: 30px;
        }

        .sidebar-section h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--color-secondary);
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.875rem;
        }

        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--color-border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            background: var(--color-surface);
            color: var(--color-primary);
        }

        .form-group textarea:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-tertiary);
        }

        .empty-state .material-icons {
            font-size: 64px;
            color: var(--color-border);
            margin-bottom: 16px;
        }

        .empty-state h3 {
            color: var(--color-secondary);
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--color-tertiary);
            margin-bottom: 24px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-tertiary);
        }

        .loading .spinner {
            border: 3px solid var(--color-border);
            border-top: 3px solid var(--color-primary);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Upload modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--color-surface);
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            border: 1px solid var(--color-border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        .upload-zone {
            border: 2px dashed var(--color-border);
            border-radius: 6px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-zone:hover {
            border-color: var(--color-primary);
            background: var(--color-hover);
        }

        .upload-zone.dragover {
            border-color: var(--color-primary);
            background: var(--color-hover);
        }

        .upload-zone .material-icons {
            font-size: 48px;
            color: var(--color-secondary);
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <!-- Side Navigation -->
        <nav class="sidebar" id="sidebar">
            <button class="sidebar-toggle" onclick="toggleSidebar()">
                <span class="material-icons">chevron_left</span>
            </button>
            <div class="sidebar-header">
                <h1 class="sidebar-logo">
                    <img src="/images/DependIQ.png" alt="DependIQ Logo"
                        style="height: 32px; width: auto; margin-right: 8px; vertical-align: middle;">
                    <span>DependIQ</span>
                </h1>
            </div>
            <div class="sidebar-nav">
                <a href="/profile" class="nav-item">
                    <span class="material-icons">person</span>
                    <span>Profile</span>
                </a>
                <a href="/projects" class="nav-item active">
                    <span class="material-icons">folder</span>
                    <span>Projects</span>
                </a>
                <a href="/jobs" class="nav-item">
                    <span class="material-icons">history</span>
                    <span>Job History</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">
                    <span class="material-icons">logout</span>
                    <span>Logout</span>
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main-content">
            <div class="projects-container">
                <div class="projects-header">
                    <h1>📚 Project Library</h1>
                    <div class="action-buttons">
                        <button class="btn btn-secondary" onclick="syncGitHubProjects()">
                            <span class="material-icons">sync</span>
                            Sync GitHub
                        </button>
                        <button class="btn btn-primary" onclick="showUploadModal()">
                            <span class="material-icons">cloud_upload</span>
                            Upload Project
                        </button>
                    </div>
                </div>

                <div id="projectsGrid" class="projects-grid">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading projects...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Project Sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <div class="project-sidebar" id="projectSidebar">
        <div class="sidebar-header">
            <h2 id="sidebarTitle">Project Details</h2>
            <button class="close-sidebar" onclick="closeSidebar()">
                <span class="material-icons">close</span>
            </button>
        </div>
        <div class="sidebar-content" id="sidebarContent">
            <!-- Content will be dynamically loaded -->
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Upload Project</h2>
                <button class="close-sidebar" onclick="closeUploadModal()">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                <span class="material-icons">cloud_upload</span>
                <p>Click to select or drag & drop a .zip file</p>
                <small style="color: #999;">Maximum file size: 100MB</small>
            </div>
            <input type="file" id="fileInput" accept=".zip" style="display: none;" onchange="handleFileSelect(event)">
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        let projects = [];
        let currentProject = null;

        // Load projects on page load
        document.addEventListener('DOMContentLoaded', async () => {
            await loadProjects();
            setupDragAndDrop();
        });

        async function loadProjects() {
            try {
                const response = await fetch('/api/projects/', {
                    credentials: 'same-origin'
                });

                if (response.ok) {
                    projects = await response.json();
                    renderProjects();
                } else if (response.status === 401) {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Failed to load projects', error);
                showError('Failed to load projects');
            }
        }

        function renderProjects() {
            const grid = document.getElementById('projectsGrid');

            if (projects.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <span class="material-icons">folder_open</span>
                        <h3>No projects yet</h3>
                        <p>Upload a project or sync your GitHub repositories to get started</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = projects.map(project => `
                <div class="project-card" onclick="showProjectDetails('${project.id}')">
                    <div class="project-header">
                        <div style="display: flex; align-items: center; flex: 1;">
                            <div class="project-icon ${project.source_type === 'github' ? 'github' : ''}">
                                <span class="material-icons">${project.source_type === 'github' ? 'code' : 'folder_zip'}</span>
                            </div>
                            <div class="project-info">
                                <div class="project-name">${escapeHtml(project.project_name)}</div>
                                <div class="project-source">
                                    <span class="material-icons" style="font-size: 14px;">${project.source_type === 'github' ? 'code' : 'archive'}</span>
                                    ${project.source_type === 'github' ? 'GitHub' : 'Uploaded'}
                                </div>
                            </div>
                        </div>
                    </div>
                    ${project.project_synopsis ? `<div class="project-synopsis">${escapeHtml(project.project_synopsis)}</div>` : ''}
                    <div class="project-stats">
                        <div class="stat">
                            <span class="material-icons">library_books</span>
                            <span>${project.dependencies_count} deps</span>
                        </div>
                        ${project.outdated_dependencies_count > 0 ? `
                        <div class="stat">
                            <span class="material-icons">update</span>
                            <span>${project.outdated_dependencies_count} outdated</span>
                        </div>
                        ` : ''}
                    </div>
                    <div class="project-badges">
                        ${project.project_type ? `<span class="badge info">${project.project_type}</span>` : ''}
                        ${project.has_updatable_dependencies === true ? `<span class="badge warning">Updates Available</span>` : ''}
                        ${project.has_updatable_dependencies === false ? `<span class="badge success">Up to Date</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function showProjectDetails(projectId) {
            currentProject = projects.find(p => p.id === projectId);
            if (!currentProject) return;

            const sidebar = document.getElementById('projectSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const title = document.getElementById('sidebarTitle');
            const content = document.getElementById('sidebarContent');

            title.textContent = currentProject.project_name;
            content.innerHTML = `
                <div class="sidebar-section">
                    <h3><span class="material-icons">info</span> Project Information</h3>
                    <div style="color: #666; line-height: 1.6;">
                        <p><strong>Source:</strong> ${currentProject.source_type === 'github' ? 'GitHub' : 'Uploaded ZIP'}</p>
                        ${currentProject.github_repo_url ? `<p><strong>Repository:</strong> <a href="${currentProject.github_repo_url}" target="_blank">${currentProject.github_repo_url}</a></p>` : ''}
                        <p><strong>Type:</strong> ${currentProject.project_type || 'Unknown'}</p>
                        <p><strong>Dependencies:</strong> ${currentProject.dependencies_count}</p>
                        ${currentProject.outdated_dependencies_count > 0 ? `<p><strong>Outdated:</strong> ${currentProject.outdated_dependencies_count}</p>` : ''}
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3><span class="material-icons">description</span> Generate Documentation</h3>
                    <p style="color: #666; margin-bottom: 15px;">Generate AI-powered documentation and create a pull request</p>
                    <button class="btn btn-primary" style="width: 100%;" onclick="generateDocs('${projectId}')">
                        <span class="material-icons">auto_awesome</span>
                        Generate Documentation
                    </button>
                </div>

                <div class="sidebar-section">
                    <h3><span class="material-icons">update</span> Update Dependencies</h3>
                    <div class="form-group">
                        <label for="customInstructions">Custom Instructions (Optional)</label>
                        <textarea id="customInstructions" placeholder="e.g., Run tests after updating, avoid major version updates, etc."></textarea>
                    </div>
                    <button class="btn btn-primary" style="width: 100%;" onclick="updateDeps('${projectId}')">
                        <span class="material-icons">system_update</span>
                        Update Dependencies
                    </button>
                </div>

                <div class="sidebar-section">
                    <h3><span class="material-icons">delete</span> Danger Zone</h3>
                    <button class="btn" style="width: 100%; background: #f44336; color: white;" onclick="deleteProject('${projectId}')">
                        <span class="material-icons">delete</span>
                        Delete Project
                    </button>
                </div>
            `;

            sidebar.classList.add('active');
            overlay.classList.add('active');
        }

        function closeSidebar() {
            document.getElementById('projectSidebar').classList.remove('active');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        async function generateDocs(projectId) {
            if (!confirm('This will generate documentation and create a pull request. Continue?')) return;

            try {
                const response = await fetch(`/api/projects/${projectId}/generate-docs`, {
                    method: 'POST',
                    credentials: 'same-origin'
                });

                if (response.ok) {
                    const data = await response.json();
                    alert('Documentation generation job created successfully!');
                    window.location.href = '/jobs';
                } else {
                    const error = await response.json();
                    alert('Failed to create documentation job: ' + error.detail);
                }
            } catch (error) {
                alert('Failed to create documentation job');
            }
        }

        async function updateDeps(projectId) {
            const instructions = document.getElementById('customInstructions').value;

            if (!confirm('This will update dependencies and create a pull request. Continue?')) return;

            try {
                const response = await fetch(`/api/projects/${projectId}/update-dependencies?custom_instructions=${encodeURIComponent(instructions)}`, {
                    method: 'POST',
                    credentials: 'same-origin'
                });

                if (response.ok) {
                    const data = await response.json();
                    alert('Dependency update job created successfully!');
                    window.location.href = '/jobs';
                } else {
                    const error = await response.json();
                    alert('Failed to create update job: ' + error.detail);
                }
            } catch (error) {
                alert('Failed to create update job');
            }
        }

        async function deleteProject(projectId) {
            if (!confirm('Are you sure you want to delete this project? This action cannot be undone.')) return;

            try {
                const response = await fetch(`/api/projects/${projectId}`, {
                    method: 'DELETE',
                    credentials: 'same-origin'
                });

                if (response.ok) {
                    alert('Project deleted successfully');
                    closeSidebar();
                    await loadProjects();
                } else {
                    alert('Failed to delete project');
                }
            } catch (error) {
                alert('Failed to delete project');
            }
        }

        async function syncGitHubProjects() {
            try {
                const response = await fetch('/api/projects/github/repositories', {
                    credentials: 'same-origin'
                });

                if (response.ok) {
                    const repos = await response.json();
                    // TODO: Show modal to select repos to import
                    alert(`Found ${repos.length} GitHub repositories`);
                } else if (response.status === 400) {
                    const error = await response.json();
                    alert(error.detail);
                    window.location.href = '/profile'; // Redirect to profile to connect GitHub
                }
            } catch (error) {
                alert('Failed to sync GitHub repositories');
            }
        }

        function showUploadModal() {
            document.getElementById('uploadModal').classList.add('active');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
        }

        function setupDragAndDrop() {
            const zone = document.getElementById('uploadZone');

            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('dragover');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('dragover');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('dragover');

                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFileUpload(files[0]);
                }
            });
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                handleFileUpload(file);
            }
        }

        async function handleFileUpload(file) {
            if (!file.name.endsWith('.zip')) {
                alert('Please select a .zip file');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/projects/upload', {
                    method: 'POST',
                    credentials: 'same-origin',
                    body: formData
                });

                if (response.ok) {
                    alert('Project uploaded successfully!');
                    closeUploadModal();
                    await loadProjects();
                } else {
                    const error = await response.json();
                    alert('Upload failed: ' + error.detail);
                }
            } catch (error) {
                alert('Upload failed');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            document.cookie = 'access_token=; path=/; max-age=0';
            window.location.href = '/login';
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
            localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
        }

        // Restore sidebar state on page load
        if (localStorage.getItem('sidebarCollapsed') === 'true') {
            document.getElementById('sidebar').classList.add('collapsed');
        }
    </script>
</body>

</html>
