<!DOCTYPE html>
<html>

<head>
    <title>Login - DependIQ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="manifest" href="/images/site.webmanifest">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="/static/js/theme.js"></script>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        .auth-container {
            max-width: 450px;
            margin: 50px auto;
            padding: 40px;
            background: var(--color-surface);
            border-radius: 8px;
            border: 1px solid var(--color-border);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            color: var(--color-primary);
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--color-secondary);
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--color-border);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
            background: var(--color-surface);
            color: var(--color-primary);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--color-primary);
            color: var(--color-surface);
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: var(--color-surface);
            color: var(--color-primary);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: var(--color-hover);
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            color: var(--color-secondary);
            position: relative;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: var(--color-border);
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .github-btn {
            width: 100%;
            padding: 14px;
            background: var(--color-primary);
            color: var(--color-surface);
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .github-btn:hover {
            opacity: 0.9;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--color-secondary);
            font-size: 14px;
        }

        .auth-footer a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover {
            opacity: 0.7;
        }

        .error-message {
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            color: var(--color-error);
            border: 1px solid var(--color-error);
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            position: relative;
            padding-right: 40px;
            font-size: 14px;
        }

        .success-message {
            padding: 12px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--color-success);
            border: 1px solid var(--color-success);
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            position: relative;
            padding-right: 40px;
            font-size: 14px;
        }

        .success-message .close-btn,
        .error-message .close-btn,
        .info-message .close-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: inherit;
            opacity: 0.7;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-message .close-btn:hover,
        .error-message .close-btn:hover,
        .info-message .close-btn:hover {
            opacity: 1;
        }

        .info-message {
            padding: 12px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--color-info);
            border: 1px solid var(--color-info);
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            position: relative;
            padding-right: 40px;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        .back-link {
            color: var(--color-primary);
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 10px;
            display: inline-block;
            font-weight: 500;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .password-input-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--color-secondary);
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            font-size: 20px;
        }

        .password-toggle:hover {
            color: var(--color-primary);
            background: var(--color-hover);
            border-radius: 4px;
        }

        .password-toggle .material-icons {
            font-size: 20px;
            user-select: none;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-header">
            <img src="/images/DependIQ.png" alt="DependIQ Logo"
                style="height: 120px; width: auto; margin-bottom: 24px;">
            <h1>Welcome to DependIQ</h1>
        </div>

        <div id="errorMessage" class="error-message">
            <button class="close-btn" onclick="hideMessages()" aria-label="Close">&times;</button>
        </div>
        <div id="successMessage" class="success-message">
            <button class="close-btn" onclick="hideMessages()" aria-label="Close">&times;</button>
        </div>
        <div id="infoMessage" class="info-message">
            <button class="close-btn" onclick="hideMessages()" aria-label="Close">&times;</button>
        </div>

        <!-- Step 1: Email Input -->
        <div id="emailStep">
            <form id="emailForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="your@email.com" autofocus>
                </div>

                <button type="submit" class="btn-primary" id="continueBtn">
                    Continue
                </button>
            </form>

            <div class="divider">or</div>

            <button class="github-btn" onclick="loginWithGitHub()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
                </svg>
                Continue with GitHub
            </button>
        </div>

        <!-- Step 2: Password Input (for existing users) -->
        <div id="passwordStep" class="hidden">
            <span class="back-link" onclick="backToEmail()">← Back</span>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="emailDisplay">Email</label>
                    <input type="email" id="emailDisplay" disabled>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" required placeholder="Enter your password"
                            style="padding-right: 45px;">
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility()">
                            <span class="material-icons">visibility</span>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    Sign In
                </button>
            </form>

            <div class="auth-footer">
                <p><a href="/forgot-password">Forgot password?</a></p>
            </div>
        </div>

    </div>

    <script>
        let currentEmail = '';
        const emailStep = document.getElementById('emailStep');
        const passwordStep = document.getElementById('passwordStep');
        const newUserStep = document.getElementById('newUserStep');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const infoMessage = document.getElementById('infoMessage');
        const emailForm = document.getElementById('emailForm');
        const passwordForm = document.getElementById('passwordForm');

        // Check for success message in URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('registered') === 'true') {
            showSuccess('Registration successful! Please check your email to verify your account.');
        }
        if (urlParams.get('verified') === 'true') {
            showSuccess('Email verified successfully! You can now log in.');
        }
        if (urlParams.get('reset') === 'true') {
            showSuccess('Password reset successfully! You can now log in with your new password.');
        }
        if (urlParams.get('magic_link_sent') === 'true') {
            showSuccess('Registration link sent! Please check your email for instructions.');
        }

        // Step 1: Email submission
        emailForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            currentEmail = email;

            hideMessages();
            const continueBtn = document.getElementById('continueBtn');
            continueBtn.disabled = true;
            continueBtn.textContent = 'Checking...';

            try {
                const response = await fetch('/api/auth/check-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.exists) {
                        // Existing user - show password step
                        showPasswordStep();
                    } else {
                        // New user - automatically send registration link
                        await sendMagicLinkAutomatically(email);
                    }
                } else {
                    showError(data.detail || 'Error checking email');
                }
            } catch (error) {
                showError('An error occurred. Please try again.');
            } finally {
                continueBtn.disabled = false;
                continueBtn.textContent = 'Continue';
            }
        });

        // Step 2: Password submission
        passwordForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;

            hideMessages();
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: currentEmail, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Store tokens in localStorage
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);

                    // Also store access token in cookie for server-side auth
                    document.cookie = `access_token=${data.access_token}; path=/; max-age=900; SameSite=Lax`;

                    // Redirect to return URL or profile
                    const returnTo = urlParams.get('return_to') || '/profile';
                    window.location.href = returnTo;
                } else {
                    showError(data.detail || 'Login failed');
                }
            } catch (error) {
                showError('An error occurred. Please try again.');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        // Automatically send registration link for new user
        async function sendMagicLinkAutomatically(email) {
            try {
                const response = await fetch('/api/auth/send-magic-link', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    // Show success message without hiding the form
                    showSuccess(`Registration link sent to ${email}! Please check your email (or console in dev mode) to complete your registration.`);

                    // Clear the email field immediately
                    document.getElementById('email').value = '';

                    // Disable the continue button and change text
                    const continueBtn = document.getElementById('continueBtn');
                    continueBtn.textContent = 'Link Sent ✓';
                    continueBtn.disabled = true;

                    // Re-enable button after 5 seconds (but keep success message visible)
                    setTimeout(() => {
                        continueBtn.textContent = 'Continue';
                        continueBtn.disabled = false;
                        document.getElementById('email').focus();
                    }, 5000);
                } else {
                    showError(data.detail || 'Failed to send registration link');
                }
            } catch (error) {
                showError('An error occurred. Please try again.');
            }
        }

        function showPasswordStep() {
            emailStep.classList.add('hidden');
            passwordStep.classList.remove('hidden');
            document.getElementById('emailDisplay').value = currentEmail;
            document.getElementById('password').focus();
        }

        function backToEmail() {
            passwordStep.classList.add('hidden');
            emailStep.classList.remove('hidden');
            currentEmail = '';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            hideMessages();
        }

        function loginWithGitHub() {
            window.location.href = '/api/auth/github';
        }

        function showError(message) {
            // Set message while preserving the close button
            const closeBtn = errorMessage.querySelector('.close-btn');
            errorMessage.textContent = message;
            if (closeBtn) {
                errorMessage.appendChild(closeBtn);
            }
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
            infoMessage.style.display = 'none';
        }

        function showSuccess(message) {
            // Set message while preserving the close button
            const closeBtn = successMessage.querySelector('.close-btn');
            successMessage.textContent = message;
            if (closeBtn) {
                successMessage.appendChild(closeBtn);
            }
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
            infoMessage.style.display = 'none';
        }

        function showInfo(message) {
            // Set message while preserving the close button
            const closeBtn = infoMessage.querySelector('.close-btn');
            infoMessage.textContent = message;
            if (closeBtn) {
                infoMessage.appendChild(closeBtn);
            }
            infoMessage.style.display = 'block';
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            infoMessage.style.display = 'none';
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('password');
            const button = document.querySelector('.password-toggle');
            const icon = button.querySelector('.material-icons');

            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }


    </script>
</body>

</html>
