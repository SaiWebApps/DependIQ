<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <title>Sign In - DependIQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Ripple / node animation background */
    .ripple-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .ripple-bg .node {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.4);
    }

    .ripple-bg .node::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      border: 1px solid rgba(99, 102, 241, 0.3);
      animation: ripple 4s ease-out infinite;
    }

    .ripple-bg .node:nth-child(1) { top: 20%; left: 15%; }
    .ripple-bg .node:nth-child(1)::after { animation-delay: 0s; }
    .ripple-bg .node:nth-child(2) { top: 60%; left: 80%; }
    .ripple-bg .node:nth-child(2)::after { animation-delay: 1s; }
    .ripple-bg .node:nth-child(3) { top: 35%; left: 65%; }
    .ripple-bg .node:nth-child(3)::after { animation-delay: 2s; }
    .ripple-bg .node:nth-child(4) { top: 75%; left: 30%; }
    .ripple-bg .node:nth-child(4)::after { animation-delay: 0.5s; }
    .ripple-bg .node:nth-child(5) { top: 45%; left: 45%; }
    .ripple-bg .node:nth-child(5)::after { animation-delay: 1.5s; }
    .ripple-bg .node:nth-child(6) { top: 85%; left: 70%; }
    .ripple-bg .node:nth-child(6)::after { animation-delay: 2.5s; }
    .ripple-bg .node:nth-child(7) { top: 10%; left: 50%; }
    .ripple-bg .node:nth-child(7)::after { animation-delay: 3s; }
    .ripple-bg .node:nth-child(8) { top: 55%; left: 20%; }
    .ripple-bg .node:nth-child(8)::after { animation-delay: 3.5s; }

    /* Connection lines between nodes */
    .ripple-bg .connection {
      position: absolute;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.15), transparent);
      transform-origin: left center;
      animation: pulse-line 6s ease-in-out infinite;
    }

    .ripple-bg .connection:nth-child(9) {
      top: 27%; left: 17%; width: 200px; transform: rotate(15deg);
      animation-delay: 0s;
    }
    .ripple-bg .connection:nth-child(10) {
      top: 58%; left: 25%; width: 250px; transform: rotate(-20deg);
      animation-delay: 1s;
    }
    .ripple-bg .connection:nth-child(11) {
      top: 42%; left: 48%; width: 180px; transform: rotate(35deg);
      animation-delay: 2s;
    }
    .ripple-bg .connection:nth-child(12) {
      top: 70%; left: 35%; width: 220px; transform: rotate(-10deg);
      animation-delay: 0.5s;
    }

    @keyframes ripple {
      0% {
        width: 4px;
        height: 4px;
        opacity: 1;
      }
      100% {
        width: 60px;
        height: 60px;
        opacity: 0;
      }
    }

    @keyframes pulse-line {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body class="h-full bg-slate-900 font-sans antialiased">
  <!-- Animated background -->
  <div class="ripple-bg">
    <div class="node"></div>
    <div class="node"></div>
    <div class="node"></div>
    <div class="node"></div>
    <div class="node"></div>
    <div class="node"></div>
    <div class="node"></div>
    <div class="node"></div>
    <div class="connection"></div>
    <div class="connection"></div>
    <div class="connection"></div>
    <div class="connection"></div>
  </div>

  <!-- Login content -->
  <div class="relative z-10 flex min-h-full flex-col items-center justify-center px-4 py-12">
    <!-- Card -->
    <div class="w-full max-w-sm">
      <!-- Logo + Tagline -->
      <div class="mb-8 text-center">
        <div class="mb-6 flex justify-center">
          <img src="/images/DependIQ.png" alt="DependIQ" class="h-10 w-auto">
        </div>
        <h1 class="text-2xl font-semibold tracking-tight text-slate-50">
          One update. Every consequence.
        </h1>
        <p class="mt-2 text-sm text-slate-400">
          See how dependency changes ripple through your entire system
        </p>
      </div>

      <!-- Error message -->
      <div id="errorMessage" class="mb-4 hidden rounded-lg border border-red-500/20 bg-red-500/10 px-4 py-3 text-sm text-red-400"></div>

      <!-- Auth buttons -->
      <div class="space-y-3">
        <a href="/api/auth/login?provider=GitHubOAuth&scope=repo"
           class="flex w-full items-center justify-center gap-3 rounded-lg bg-slate-800 border border-slate-700 px-4 py-3 text-sm font-medium text-slate-200 transition-all hover:bg-slate-750 hover:border-slate-600 hover:text-white">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          Sign in with GitHub
        </a>

        <a href="/api/auth/login?provider=GoogleOAuth"
           class="flex w-full items-center justify-center gap-3 rounded-lg bg-slate-800 border border-slate-700 px-4 py-3 text-sm font-medium text-slate-200 transition-all hover:bg-slate-750 hover:border-slate-600 hover:text-white">
          <svg class="h-5 w-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Sign in with Google
        </a>

        <a href="/api/auth/login?provider=MicrosoftOAuth"
           class="flex w-full items-center justify-center gap-3 rounded-lg bg-slate-800 border border-slate-700 px-4 py-3 text-sm font-medium text-slate-200 transition-all hover:bg-slate-750 hover:border-slate-600 hover:text-white">
          <svg class="h-5 w-5" viewBox="0 0 23 23">
            <rect fill="#f25022" x="1" y="1" width="10" height="10"/>
            <rect fill="#7fba00" x="12" y="1" width="10" height="10"/>
            <rect fill="#00a4ef" x="1" y="12" width="10" height="10"/>
            <rect fill="#ffb900" x="12" y="12" width="10" height="10"/>
          </svg>
          Sign in with Microsoft
        </a>

        <a href="/api/auth/login?provider=AppleOAuth"
           class="flex w-full items-center justify-center gap-3 rounded-lg bg-slate-800 border border-slate-700 px-4 py-3 text-sm font-medium text-slate-200 transition-all hover:bg-slate-750 hover:border-slate-600 hover:text-white">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
          </svg>
          Sign in with Apple
        </a>
      </div>

      <!-- Divider -->
      <div class="my-6 flex items-center gap-3">
        <div class="h-px flex-1 bg-slate-700"></div>
        <span class="text-xs text-slate-500">or</span>
        <div class="h-px flex-1 bg-slate-700"></div>
      </div>

      <!-- Email sign in -->
      <a href="/api/auth/login"
         class="flex w-full items-center justify-center rounded-lg bg-indigo-600 px-4 py-3 text-sm font-medium text-white transition-all hover:bg-indigo-500">
        Sign in with Email
      </a>

      <!-- Footer -->
      <p class="mt-8 text-center text-xs text-slate-500">
        By signing in, you agree to our terms of service.
      </p>
    </div>
  </div>

  <script>
    // Show error message if present in URL
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    if (error) {
      const el = document.getElementById('errorMessage');
      const messages = {
        'auth_denied': 'Authentication was denied. Please try again.',
        'auth_failed': 'Authentication failed. Please try again.',
        'no_code': 'Invalid authentication response. Please try again.',
      };
      el.textContent = messages[error] || 'An error occurred. Please try again.';
      el.classList.remove('hidden');
    }
  </script>
</body>
</html>
