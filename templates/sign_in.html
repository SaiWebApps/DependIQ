<!DOCTYPE html>
<html>
<head>
  <title>Sign In - DependIQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="/static/js/theme.js?v=2"></script>
  <style>
    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: var(--color-background);
    }

    .login-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 48px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .login-logo {
      margin-bottom: 24px;
    }

    .login-logo img {
      height: 48px;
      width: auto;
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 0.9rem;
      color: var(--color-secondary);
      margin-bottom: 32px;
    }

    .login-btn {
      display: block;
      width: 100%;
      padding: 14px 24px;
      background: var(--color-primary);
      color: var(--color-surface);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
      margin-bottom: 12px;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    .login-btn.github {
      background: #24292e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .login-divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: var(--color-secondary);
      font-size: 0.85rem;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--color-border);
    }

    .login-divider::before {
      margin-right: 12px;
    }

    .login-divider::after {
      margin-left: 12px;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      color: var(--color-error);
      border: 1px solid var(--color-error);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.875rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <img src="/images/DependIQ.png" alt="DependIQ Logo">
      </div>
      <h1 class="login-title">Welcome to DependIQ</h1>
      <p class="login-subtitle">Sign in to manage your dependencies</p>

      <div id="errorMessage" class="error-message"></div>

      <a href="/api/auth/login?provider=GitHubOAuth&scope=repo" class="login-btn github">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
        Sign in with GitHub
      </a>

      <div class="login-divider">or</div>

      <a href="/api/auth/login" class="login-btn">
        Sign in with Email
      </a>
    </div>
  </div>

  <script>
    // Show error message if present in URL
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    if (error) {
      const el = document.getElementById('errorMessage');
      const messages = {
        'auth_denied': 'Authentication was denied. Please try again.',
        'auth_failed': 'Authentication failed. Please try again.',
        'no_code': 'Invalid authentication response. Please try again.',
      };
      el.textContent = messages[error] || 'An error occurred. Please try again.';
      el.style.display = 'block';
    }
  </script>
</body>
</html>
