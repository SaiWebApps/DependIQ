<!DOCTYPE html>
<html>
<head>
  <title>Sign In - DependIQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="/static/js/theme.js?v=2"></script>
  <style>
    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: var(--color-background);
    }

    .login-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 48px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .login-logo {
      margin-bottom: 24px;
    }

    .login-logo img {
      height: 48px;
      width: auto;
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 0.9rem;
      color: var(--color-secondary);
      margin-bottom: 32px;
    }

    .login-btn {
      display: block;
      width: 100%;
      padding: 14px 24px;
      background: var(--color-primary);
      color: var(--color-surface);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
      margin-bottom: 12px;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    .login-btn.github {
      background: #24292e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .login-btn.google {
      background: #fff;
      color: #3c4043;
      border: 1px solid #dadce0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .login-btn.google:hover {
      background: #f7f8f8;
    }

    .login-btn.microsoft {
      background: #2f2f2f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .login-btn.apple {
      background: #000;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .login-divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: var(--color-secondary);
      font-size: 0.85rem;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--color-border);
    }

    .login-divider::before {
      margin-right: 12px;
    }

    .login-divider::after {
      margin-left: 12px;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      color: var(--color-error);
      border: 1px solid var(--color-error);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.875rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <img src="/images/DependIQ.png" alt="DependIQ Logo">
      </div>
      <h1 class="login-title">Welcome to DependIQ</h1>
      <p class="login-subtitle">Sign in to manage your dependencies</p>

      <div id="errorMessage" class="error-message"></div>

      <a href="/api/auth/login?provider=GitHubOAuth&scope=repo" class="login-btn github">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
        Sign in with GitHub
      </a>

      <a href="/api/auth/login?provider=GoogleOAuth" class="login-btn google">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Sign in with Google
      </a>

      <a href="/api/auth/login?provider=MicrosoftOAuth" class="login-btn microsoft">
        <svg width="20" height="20" viewBox="0 0 23 23">
          <rect fill="#f25022" x="1" y="1" width="10" height="10"/>
          <rect fill="#7fba00" x="12" y="1" width="10" height="10"/>
          <rect fill="#00a4ef" x="1" y="12" width="10" height="10"/>
          <rect fill="#ffb900" x="12" y="12" width="10" height="10"/>
        </svg>
        Sign in with Microsoft
      </a>

      <a href="/api/auth/login?provider=AppleOAuth" class="login-btn apple">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
        </svg>
        Sign in with Apple
      </a>

      <div class="login-divider">or</div>

      <a href="/api/auth/login" class="login-btn">
        Sign in with Email
      </a>
    </div>
  </div>

  <script>
    // Show error message if present in URL
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    if (error) {
      const el = document.getElementById('errorMessage');
      const messages = {
        'auth_denied': 'Authentication was denied. Please try again.',
        'auth_failed': 'Authentication failed. Please try again.',
        'no_code': 'Invalid authentication response. Please try again.',
      };
      el.textContent = messages[error] || 'An error occurred. Please try again.';
      el.style.display = 'block';
    }
  </script>
</body>
</html>
