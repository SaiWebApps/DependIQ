<!DOCTYPE html>
<html>

<head>
    <title>Job History - DependIQ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="manifest" href="/images/site.webmanifest">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="/static/js/theme.js?v=2"></script>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        .jobs-container {
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .jobs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .jobs-header h1 {
            color: #333;
            font-size: 2rem;
            margin: 0;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .filter-tab {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            transition: all 0.3s ease;
        }

        .filter-tab:hover {
            color: #1976d2;
        }

        .filter-tab.active {
            color: #1976d2;
            border-bottom-color: #1976d2;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-card .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .stat-card.queued .stat-value {
            color: #ff9800;
        }

        .stat-card.running .stat-value {
            color: #2196f3;
        }

        .stat-card.completed .stat-value {
            color: #4caf50;
        }

        .stat-card.failed .stat-value {
            color: #f44336;
        }

        .jobs-list {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .job-item {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            transition: background 0.3s ease;
            cursor: pointer;
        }

        .job-item:last-child {
            border-bottom: none;
        }

        .job-item:hover {
            background: #f5f5f5;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .job-info {
            flex: 1;
        }

        .job-name {
            font-size: 1.1rem;
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
        }

        .job-project {
            font-size: 0.9rem;
            color: #666;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .job-status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .job-status-badge.queued {
            background: #fff3e0;
            color: #ef6c00;
        }

        .job-status-badge.running {
            background: #e3f2fd;
            color: #1976d2;
        }

        .job-status-badge.completed {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .job-status-badge.failed {
            background: #ffebee;
            color: #c62828;
        }

        .job-status-badge.cancelled {
            background: #f5f5f5;
            color: #757575;
        }

        .job-progress {
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .progress-fill {
            height: 100%;
            background: #1976d2;
            transition: width 0.3s ease;
        }

        .progress-fill.completed {
            background: #4caf50;
        }

        .progress-fill.failed {
            background: #f44336;
        }

        .progress-text {
            font-size: 0.8rem;
            color: #666;
        }

        .job-meta {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: #666;
        }

        .job-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .job-meta-item .material-icons {
            font-size: 16px;
        }

        .job-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .job-action-btn {
            padding: 6px 16px;
            border-radius: 6px;
            border: none;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .job-action-btn.primary {
            background: #1976d2;
            color: white;
        }

        .job-action-btn.primary:hover {
            background: #1565c0;
        }

        .job-action-btn.secondary {
            background: #f5f5f5;
            color: #666;
        }

        .job-action-btn.secondary:hover {
            background: #e0e0e0;
        }

        .job-action-btn.danger {
            background: #ffebee;
            color: #c62828;
        }

        .job-action-btn.danger:hover {
            background: #ef5350;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state .material-icons {
            font-size: 64px;
            color: #ddd;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            color: #666;
            margin-bottom: 8px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .loading .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1976d2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <!-- Side Navigation -->
        <nav class="sidebar" id="sidebar">
            <button class="sidebar-toggle" onclick="toggleSidebar()">
                <span class="material-icons">chevron_left</span>
            </button>
            <div class="sidebar-header">
                <h1 class="sidebar-logo">
                    <img src="/images/DependIQ.png" alt="DependIQ Logo"
                        style="height: 32px; width: auto; margin-right: 8px; vertical-align: middle;">
                    <span>DependIQ</span>
                </h1>
            </div>
            <div class="sidebar-nav">
                <a href="/profile" class="nav-item">
                    <span class="material-icons">person</span>
                    <span>Profile</span>
                </a>
                <a href="/projects" class="nav-item">
                    <span class="material-icons">folder</span>
                    <span>Projects</span>
                </a>
                <a href="/jobs" class="nav-item active">
                    <span class="material-icons">history</span>
                    <span>Job History</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">
                    <span class="material-icons">logout</span>
                    <span>Logout</span>
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main-content">
            <div class="jobs-container">
                <div class="jobs-header">
                    <h1>📋 Job History</h1>
                </div>

                <!-- Statistics -->
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <div class="stat-value">-</div>
                        <div class="stat-label">Total Jobs</div>
                    </div>
                    <div class="stat-card queued">
                        <div class="stat-value">-</div>
                        <div class="stat-label">Queued</div>
                    </div>
                    <div class="stat-card running">
                        <div class="stat-value">-</div>
                        <div class="stat-label">Running</div>
                    </div>
                    <div class="stat-card completed">
                        <div class="stat-value">-</div>
                        <div class="stat-label">Completed</div>
                    </div>
                    <div class="stat-card failed">
                        <div class="stat-value">-</div>
                        <div class="stat-label">Failed</div>
                    </div>
                </div>

                <!-- Filter Tabs -->
                <div class="filter-tabs">
                    <button class="filter-tab active" onclick="filterJobs('all')">All</button>
                    <button class="filter-tab" onclick="filterJobs('queued')">Queued</button>
                    <button class="filter-tab" onclick="filterJobs('running')">Running</button>
                    <button class="filter-tab" onclick="filterJobs('completed')">Completed</button>
                    <button class="filter-tab" onclick="filterJobs('failed')">Failed</button>
                </div>

                <!-- Jobs List -->
                <div class="jobs-list" id="jobsList">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading jobs...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        let jobs = [];
        let currentFilter = 'all';
        let refreshInterval = null;

        // Load jobs on page load
        document.addEventListener('DOMContentLoaded', async () => {
            await loadJobs();
            await loadStats();

            // Auto-refresh every 5 seconds if there are running jobs
            refreshInterval = setInterval(async () => {
                const hasRunning = jobs.some(j => j.status === 'running' || j.status === 'queued');
                if (hasRunning) {
                    await loadJobs();
                    await loadStats();
                }
            }, 5000);
        });

        // Clean up interval on page unload
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });

        async function loadJobs() {
            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch('/api/jobs/', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    jobs = await response.json();
                    renderJobs();
                } else if (response.status === 401) {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Failed to load jobs', error);
            }
        }

        async function loadStats() {
            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch('/api/jobs/stats/summary', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const stats = await response.json();
                    renderStats(stats);
                }
            } catch (error) {
                console.error('Failed to load stats', error);
            }
        }

        function renderStats(stats) {
            const grid = document.getElementById('statsGrid');
            grid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${stats.total}</div>
                    <div class="stat-label">Total Jobs</div>
                </div>
                <div class="stat-card queued">
                    <div class="stat-value">${stats.queued}</div>
                    <div class="stat-label">Queued</div>
                </div>
                <div class="stat-card running">
                    <div class="stat-value">${stats.running}</div>
                    <div class="stat-label">Running</div>
                </div>
                <div class="stat-card completed">
                    <div class="stat-value">${stats.completed}</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-card failed">
                    <div class="stat-value">${stats.failed}</div>
                    <div class="stat-label">Failed</div>
                </div>
            `;
        }

        function filterJobs(status) {
            currentFilter = status;

            // Update active tab
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            renderJobs();
        }

        function renderJobs() {
            const list = document.getElementById('jobsList');

            let filteredJobs = jobs;
            if (currentFilter !== 'all') {
                filteredJobs = jobs.filter(j => j.status === currentFilter);
            }

            if (filteredJobs.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <span class="material-icons">work_off</span>
                        <h3>No jobs found</h3>
                        <p>${currentFilter === 'all' ? 'Start working on projects to see your job history' : `No ${currentFilter} jobs`}</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = filteredJobs.map(job => {
                const isRunning = job.status === 'running' || job.status === 'queued';
                const canCancel = job.status === 'queued' || job.status === 'running';

                return `
                    <div class="job-item">
                        <div class="job-header">
                            <div class="job-info">
                                <div class="job-name">${escapeHtml(job.job_name)}</div>
                                ${job.project_name ? `
                                <div class="job-project">
                                    <span class="material-icons" style="font-size: 14px;">folder</span>
                                    ${escapeHtml(job.project_name)}
                                </div>
                                ` : ''}
                            </div>
                            <div class="job-status-badge ${job.status} ${isRunning ? 'pulse' : ''}">
                                <span class="material-icons" style="font-size: 16px;">
                                    ${getStatusIcon(job.status)}
                                </span>
                                ${job.status.charAt(0).toUpperCase() + job.status.slice(1)}
                            </div>
                        </div>

                        ${job.job_description ? `<div style="color: #666; margin-bottom: 12px;">${escapeHtml(job.job_description)}</div>` : ''}

                        ${job.status === 'running' ? `
                        <div class="job-progress">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${job.progress_percentage}%"></div>
                            </div>
                            <div class="progress-text">${job.current_step || 'Processing...'} (${job.progress_percentage}%)</div>
                        </div>
                        ` : ''}

                        ${job.status === 'completed' && job.pull_request_url ? `
                        <div style="margin-bottom: 12px;">
                            <a href="${job.pull_request_url}" target="_blank" style="color: #1976d2; text-decoration: none; display: flex; align-items: center; gap: 4px;">
                                <span class="material-icons" style="font-size: 16px;">open_in_new</span>
                                View Pull Request
                            </a>
                        </div>
                        ` : ''}

                        ${job.error_message ? `
                        <div style="color: #c62828; margin-bottom: 12px; padding: 12px; background: #ffebee; border-radius: 6px;">
                            <strong>Error:</strong> ${escapeHtml(job.error_message)}
                        </div>
                        ` : ''}

                        <div class="job-meta">
                            <div class="job-meta-item">
                                <span class="material-icons">schedule</span>
                                Created ${formatDate(job.created_at)}
                            </div>
                            ${job.completed_at ? `
                            <div class="job-meta-item">
                                <span class="material-icons">check_circle</span>
                                Completed ${formatDate(job.completed_at)}
                            </div>
                            ` : ''}
                        </div>

                        <div class="job-actions">
                            ${canCancel ? `
                            <button class="job-action-btn danger" onclick="cancelJob('${job.id}')">
                                <span class="material-icons" style="font-size: 16px;">cancel</span>
                                Cancel
                            </button>
                            ` : ''}
                            <button class="job-action-btn secondary" onclick="deleteJob('${job.id}')">
                                <span class="material-icons" style="font-size: 16px;">delete</span>
                                Delete
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getStatusIcon(status) {
            const icons = {
                'queued': 'schedule',
                'running': 'autorenew',
                'completed': 'check_circle',
                'failed': 'error',
                'cancelled': 'cancel'
            };
            return icons[status] || 'help';
        }

        async function cancelJob(jobId) {
            if (!confirm('Are you sure you want to cancel this job?')) return;

            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch(`/api/jobs/${jobId}/cancel`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    await loadJobs();
                    await loadStats();
                } else {
                    const error = await response.json();
                    alert('Failed to cancel job: ' + error.detail);
                }
            } catch (error) {
                alert('Failed to cancel job');
            }
        }

        async function deleteJob(jobId) {
            if (!confirm('Are you sure you want to delete this job from history?')) return;

            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch(`/api/jobs/${jobId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    await loadJobs();
                    await loadStats();
                } else {
                    alert('Failed to delete job');
                }
            } catch (error) {
                alert('Failed to delete job');
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;

            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return 'just now';
            if (minutes < 60) return `${minutes}m ago`;
            if (hours < 24) return `${hours}h ago`;
            if (days < 7) return `${days}d ago`;

            return date.toLocaleDateString();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            document.cookie = 'access_token=; path=/; max-age=0';
            window.location.href = '/login';
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
            localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
        }

        // Restore sidebar state on page load
        if (localStorage.getItem('sidebarCollapsed') === 'true') {
            document.getElementById('sidebar').classList.add('collapsed');
        }


    </script>
</body>

</html>
