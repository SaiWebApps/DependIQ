# Render Blueprint Configuration for DependIQ Staging Environment
# This file configures automatic deployment to Render from GitHub

services:
  # Web Service - FastAPI Application
  - type: web
    name: dependiq-staging
    runtime: python
    plan: free  # Free tier (750 hours/month)
    region: oregon  # Choose: oregon, frankfurt, singapore
    branch: main  # Deploy from main branch (change if using different branch)
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: dependiq-staging-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false  # Must be set manually in Render dashboard
      - key: JWT_SECRET_KEY
        generateValue: true  # Auto-generate secure secret
      - key: SECRET_KEY
        generateValue: true  # Auto-generate secure secret
      - key: SESSION_SECRET
        generateValue: true  # Auto-generate secure secret
      - key: SECURE_COOKIES
        value: true  # Enable secure cookies in staging
      - key: APP_URL
        value: https://dependiq-staging.onrender.com  # Update after deployment
      - key: GITHUB_REDIRECT_URI
        value: https://dependiq-staging.onrender.com/api/auth/github/callback
      - key: GITHUB_CLIENT_ID
        sync: false  # Optional - set if using GitHub OAuth
      - key: GITHUB_CLIENT_SECRET
        sync: false  # Optional - set if using GitHub OAuth
      - key: EMAIL_SERVICE
        value: resend
      - key: RESEND_API_KEY
        sync: false  # Optional - set if using email features (get from resend.com)
      - key: EMAIL_FROM
        value: onboarding@resend.dev
    autoDeploy: true  # Enable automatic deployments from GitHub

databases:
  # PostgreSQL Database
  - name: dependiq-staging-db
    databaseName: dependiq
    plan: free  # Free PostgreSQL for 90 days, then $7/month
    region: oregon  # Same region as web service for lower latency
    ipAllowList: []  # Empty = allow all (suitable for staging)
