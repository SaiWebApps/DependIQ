services:
  - type: web
    name: DependIQ
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: DependIQ-DB
          property: connectionString
      - key: APP_URL
        value: https://dependiq.onrender.com
      - key: WORKOS_REDIRECT_URI
        value: https://dependiq.onrender.com/api/auth/callback
      # Secrets — set once via Render API, never regenerated
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_COOKIE_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: DependIQ-DB
    databaseName: dependiq
    plan: free
    region: oregon
    ipAllowList: []
