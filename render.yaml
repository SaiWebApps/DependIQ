services:
  - type: web
    name: DependIQ
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: DependIQ-DB
          property: connectionString
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: SECURE_COOKIES
        value: "true"
      - key: APP_URL
        value: https://dependiq.onrender.com
      - key: GITHUB_REDIRECT_URI
        value: https://dependiq.onrender.com/api/auth/github/callback
      - key: EMAIL_SERVICE
        value: resend
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      # Secrets — set once via Render API, never regenerated
      - key: JWT_SECRET_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: DependIQ-DB
    databaseName: dependiq
    plan: free
    region: oregon
    ipAllowList: []
