[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dependiq"
version = "0.1.0"
description = "AI-powered dependency update tool with intelligent compatibility fixes"
authors = [{name = "dependiq Team"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.27.1",
    "openai==1.30.1",
    "python-multipart==0.0.9",
    "httpx==0.24.1",
    "aiohttp==3.9.1",
    "jinja2==3.1.4",
]

[tool.setuptools]
packages = ["app", "app.api", "app.middleware", "app.models", "app.services", "app.utils"]

[project.optional-dependencies]
dev = [
    "ruff==0.1.15",
    "black==23.12.1",
    "isort==5.13.2",
    "mypy==1.8.0",
    "pre-commit==3.6.0",
    "pytest==8.4.2",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
  | __pycache__
  | \.pytest_cache
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit security
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "S101",  # use of assert (ok in tests)
    "T201",  # print statements (ok for this project)
    "S608",  # possible SQL injection (false positives)
    "S108",  # insecure temp file usage (ok for this project)
    "S110",  # try-except-pass (sometimes needed)
    "S112",  # try-except-continue (sometimes needed)
    "S701",  # jinja2 autoescape (not needed for non-HTML templates)
    "E722",  # bare except (sometimes needed for broad exception handling)
    "B007",  # unused loop variables (ok when using os.walk)
    "B904",  # raise without from (ok for API design)
    "C414",  # unnecessary list() call (ok for clarity)
    "C416",  # unnecessary dict comprehension (ok for readability)
    "SIM105", # contextlib.suppress (prefer explicit try-except)
    "SIM115", # context manager for files (sometimes not practical)
    "SIM118", # dict.keys() (ok for clarity)
    "S104",  # binding to all interfaces (ok for dev server)
    "S311",  # standard pseudo-random generators (ok for non-crypto use)
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["B018", "S101", "S105", "S106", "S107"]  # Allow test fixtures with tokens/passwords
"tests/*.py" = ["S105", "S106", "S107"]  # Allow hardcoded test data in all test files
"app/api/auth.py" = ["S106"]  # token_type parameter is not a password
"app/middleware/*.py" = ["S106"]  # token_type parameter is not a password
"app/services/auth_service.py" = ["S106"]  # token_type parameter is not a password
"app/services/token_service.py" = ["S107"]  # token_type default is not a password
"app/services/github_oauth.py" = ["S105"]  # URL string is not a password
"app/services/github_oauth_service.py" = ["S105"]  # URL constant is not a password


[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["prompt_templates"]
skip_glob = [".venv/*", "build/*", "dist/*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
show_error_codes = true
strict_optional = false
check_untyped_defs = false
exclude = [
    "alembic/",
    "tests/",
    "build/",
    "dist/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = "main"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.api.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.services.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
