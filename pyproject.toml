[project]
name = "dependiq"
version = "0.2.0"
description = "AI-powered dependency intelligence platform"
authors = [{name = "dependiq Team"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.27.1",
    "gunicorn>=21.2.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.1",
    "litellm>=1.40.0",
    "python-multipart>=0.0.9",
    "httpx>=0.24.1",
    "aiohttp>=3.9.1",
    "jinja2>=3.1.4",
    "authlib>=1.2.1",
    "requests>=2.31.0",
    "python-jose[cryptography]>=3.3.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "greenlet>=3.0.3",
    "bcrypt>=4.1.2",
    "pyjwt>=2.8.0",
    "email-validator>=2.1.0",
    "pydantic[email]>=2.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.21.0",
    "aiosqlite>=0.19.0",
]
test = [
    "selenium>=4.16.0",
    "webdriver-manager>=4.0.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit security
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
    "I",   # isort
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "S101",  # use of assert (ok in tests)
    "T201",  # print statements (ok for this project)
    "S608",  # possible SQL injection (false positives)
    "S108",  # insecure temp file usage (ok for this project)
    "S110",  # try-except-pass (sometimes needed)
    "S112",  # try-except-continue (sometimes needed)
    "S701",  # jinja2 autoescape (not needed for non-HTML templates)
    "E722",  # bare except (sometimes needed for broad exception handling)
    "B007",  # unused loop variables (ok when using os.walk)
    "B904",  # raise without from (ok for API design)
    "C414",  # unnecessary list() call (ok for clarity)
    "C416",  # unnecessary dict comprehension (ok for readability)
    "SIM105", # contextlib.suppress (prefer explicit try-except)
    "SIM115", # context manager for files (sometimes not practical)
    "SIM118", # dict.keys() (ok for clarity)
    "S104",  # binding to all interfaces (ok for dev server)
    "S311",  # standard pseudo-random generators (ok for non-crypto use)
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["B018", "S101", "S105", "S106", "S107"]
"tests/*.py" = ["S105", "S106", "S107"]
"app/api/auth.py" = ["S106"]
"app/middleware/*.py" = ["S106"]
"app/services/auth_service.py" = ["S106"]
"app/services/token_service.py" = ["S107"]
"app/services/github_oauth.py" = ["S105"]
"app/services/github_oauth_service.py" = ["S105"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
show_error_codes = true
strict_optional = false
check_untyped_defs = false
exclude = [
    "alembic/",
    "tests/",
    "build/",
    "dist/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = "main"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.api.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.services.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
